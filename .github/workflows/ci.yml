name: CI

on:
  pull_request:
  # The release workflow runs this whole suite on the tagged commit before it publishes anything.
  workflow_call:
  push:
    # Work branches too, so a branch is tested on the macOS/Windows runners before it reaches main.
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests cancel superseded runs; pushes queue behind the running one so every result is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.OVE_CI_OSES || '["linux","macos","windows"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '"macos-15"') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '"windows-2025"') || (vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"')) }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build prerequisites (Linux audio and keyring headers)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (document core)
        run: cargo clippy -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback --all-targets -- -D warnings
      - name: test (document core)
        run: cargo test -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback
      - name: schema / typings drift
        shell: bash
        run: |
          cargo run -q -p ove-core --bin ove-schema -- --check
          cargo run -q -p ove-projection --bin ove-typings -- --check
      - name: projection corpus type-checks against timeline.d.ts
        shell: bash
        run: tools/check-projection-types.sh

  media:
    name: workspace + desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners by default (free for public repositories); OVE_CI_OSES and OVE_RUNNER_* override.
        # See docs/ci-runners.md.
        os: ${{ fromJSON(vars.OVE_CI_OSES || '["linux","macos","windows"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '"macos-15"') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '"windows-2025"') || (vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d nasm pkg-config ffmpeg
      - name: build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          pkgs="nasm libdav1d-dev pkg-config ffmpeg clang libclang-dev cmake libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev"
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $pkgs
          else
            echo "No passwordless apt on this runner; expecting these packages to be installed: $pkgs"
          fi
      - name: build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg nasm llvm
          vcpkg install dav1d:x64-windows
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make pkg-config diffutils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg (LGPL, shared)
        if: runner.os != 'Windows'
        run: tools/ffmpeg/build.sh --ci
      - name: FFmpeg (LGPL, shared; MSYS2 shell with the MSVC environment)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tools/ffmpeg/build.sh --ci
      - name: test media matrix (generated with the runner's ffmpeg CLI; test-only)
        run: python3 tests/media/media.py generate
      - name: UI typecheck / lint / test / licences
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run licenses
      - name: clippy + test (whole workspace, every crate)
        run: |
          source tools/ffmpeg/env.sh
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: bindings drift
        run: |
          source tools/ffmpeg/env.sh
          cargo run -q -p ove-desktop --features bindings --bin export-bindings -- --check
      - name: benchmark on the matrix (JSON artefacts)
        run: |
          source tools/ffmpeg/env.sh
          mkdir -p bench-out
          for f in tests/media/files/*; do cargo run -q --release -p ove-bench -- "$f" > "bench-out/$(basename "$f").json" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: bench-and-ffmpeg-${{ matrix.os }}
          path: |
            bench-out
            tools/ffmpeg/out/*/buildconf.txt
            tools/ffmpeg/out/*/sizes.txt
      - name: debug app build
        working-directory: apps/desktop
        run: |
          source ../../tools/ffmpeg/env.sh
          pnpm tauri build --debug --no-bundle

  windows-cross:
    # The Windows code (cfg(windows), the Windows viewer, keyring, FFmpeg and whisper.cpp bindings) checked from a
    # Linux runner with the MinGW-w64 cross build, so it cannot break silently without a Windows runner.
    name: Windows code (cross clippy on Linux)
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: prerequisites (MinGW-w64)
        run: |
          pkgs="gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools nasm meson ninja-build pkg-config cmake clang
            libclang-dev"
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $pkgs
          else
            echo "No passwordless apt on this runner; expecting these packages to be installed: $pkgs"
          fi
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out/windows-x64-gnu
          key: ffmpeg-windows-x64-gnu-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg for Windows (LGPL, shared, cross-built)
        run: tools/ffmpeg/build.sh --ci --target windows-x64-gnu
      - name: clippy (x86_64-pc-windows-gnu, whole workspace)
        run: |
          export OVE_FFMPEG_TARGET=windows-x64-gnu
          source tools/ffmpeg/env.sh
          cargo clippy --target x86_64-pc-windows-gnu --workspace --all-targets -- -D warnings

  deny:
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
