name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (document core)
        run: cargo clippy -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback --all-targets -- -D warnings
      - name: test (document core)
        run: cargo test -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback
      - name: schema / typings drift
        shell: bash
        run: |
          cargo run -q -p ove-core --bin ove-schema -- --check
          cargo run -q -p ove-projection --bin ove-typings -- --check
      - name: projection corpus type-checks against timeline.d.ts
        shell: bash
        run: tools/check-projection-types.sh

  media:
    name: media + desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d nasm pkg-config ffmpeg
      - name: build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg nasm
          vcpkg install dav1d:x64-windows
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make pkg-config diffutils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg (LGPL, shared)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then msys2 -c 'tools/ffmpeg/build.sh --ci'; else tools/ffmpeg/build.sh --ci; fi
      - name: test media matrix (generated with the runner's ffmpeg CLI; test-only)
        run: python3 tests/media/media.py generate
      - name: UI typecheck / lint / test / licences
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run licenses
      - name: clippy + test (media, playback, gpu, bench, desktop)
        run: |
          source tools/ffmpeg/env.sh
          cargo clippy -p ove-media -p ove-playback -p ove-gpu -p ove-bench -p ove-desktop --all-targets --all-features -- -D warnings
          cargo test -p ove-media -p ove-playback -p ove-gpu -p ove-bench -p ove-desktop --all-features
      - name: bindings drift
        run: |
          source tools/ffmpeg/env.sh
          cargo run -q -p ove-desktop --bin export-bindings -- --check
      - name: benchmark on the matrix (JSON artefacts)
        run: |
          source tools/ffmpeg/env.sh
          mkdir -p bench-out
          for f in tests/media/files/*; do cargo run -q --release -p ove-bench -- "$f" > "bench-out/$(basename "$f").json" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: bench-and-ffmpeg-${{ matrix.os }}
          path: |
            bench-out
            tools/ffmpeg/out/*/buildconf.txt
            tools/ffmpeg/out/*/sizes.txt
      - name: debug app build
        working-directory: apps/desktop
        run: |
          source ../../tools/ffmpeg/env.sh
          pnpm tauri build --debug --no-bundle

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
