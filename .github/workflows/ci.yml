name: CI

on:
  pull_request:
  # The release workflow runs this whole suite on the tagged commit before it publishes anything.
  workflow_call:
  push:
    # Work branches too, so a branch is tested on the macOS/Windows runners before it reaches main.
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests cancel superseded runs; pushes queue behind the running one so every result is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.OVE_CI_OSES || '["linux","macos","windows"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '"macos-15"') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '"windows-2025"') || (vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"')) }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build prerequisites (Linux audio and keyring headers)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (document core)
        run: cargo clippy -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback --all-targets -- -D warnings
      - name: test (document core)
        run: cargo test -p ove-core -p ove-store -p ove-projection -p ove-cli -p ove-playback
      - name: schema / typings drift
        shell: bash
        run: |
          cargo run -q -p ove-core --bin ove-schema -- --check
          cargo run -q -p ove-projection --bin ove-typings -- --check
      - name: projection corpus type-checks against timeline.d.ts
        shell: bash
        run: tools/check-projection-types.sh

  media:
    name: workspace + desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners by default (free for public repositories); OVE_CI_OSES and OVE_RUNNER_* override.
        # See docs/ci-runners.md.
        os: ${{ fromJSON(vars.OVE_CI_OSES || '["linux","macos","windows"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '"macos-15"') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '"windows-2025"') || (vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d nasm pkg-config ffmpeg
      - name: build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          pkgs="nasm libdav1d-dev pkg-config ffmpeg clang libclang-dev cmake libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev"
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $pkgs
          else
            echo "No passwordless apt on this runner; expecting these packages to be installed: $pkgs"
          fi
      - name: build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg nasm llvm
          vcpkg install dav1d:x64-windows zlib:x64-windows
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make pkg-config diffutils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg (LGPL, shared)
        if: runner.os != 'Windows'
        run: tools/ffmpeg/build.sh --ci
      - name: FFmpeg (LGPL, shared; MSYS2 shell with the MSVC environment)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tools/ffmpeg/build.sh --ci
      - name: test media matrix (generated with the runner's ffmpeg CLI; test-only)
        run: python3 tests/media/media.py generate
      - name: UI typecheck / lint / test / licences
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run licenses
      - name: clippy + test (whole workspace, every crate)
        run: |
          source tools/ffmpeg/env.sh
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: bindings drift
        run: |
          source tools/ffmpeg/env.sh
          cargo run -q -p ove-desktop --features bindings --bin export-bindings -- --check
      - name: benchmark on the matrix (JSON artefacts)
        run: |
          source tools/ffmpeg/env.sh
          mkdir -p bench-out
          for f in tests/media/files/*; do cargo run -q --release -p ove-bench -- "$f" > "bench-out/$(basename "$f").json" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: bench-and-ffmpeg-${{ matrix.os }}
          path: |
            bench-out
            tools/ffmpeg/out/*/buildconf.txt
            tools/ffmpeg/out/*/sizes.txt
      - name: debug app build
        working-directory: apps/desktop
        run: |
          source ../../tools/ffmpeg/env.sh
          pnpm tauri build --debug --no-bundle

  app-e2e:
    # The real desktop app (debug build) driven through tauri-driver: every main user flow, see
    # apps/desktop/e2e-app/run.mjs. Releases need this green on every OS.
    name: app e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: prerequisites (Linux; WebKitWebDriver, Xvfb, speech synthesis, X11 window close)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libdav1d-dev pkg-config ffmpeg clang libclang-dev cmake libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev \
            webkit2gtk-driver xvfb espeak-ng python3-xlib
      - name: prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg nasm llvm
          vcpkg install dav1d:x64-windows zlib:x64-windows
      - name: display resolution (Windows; the runner's default 1024×768 is smaller than the app's window)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make pkg-config diffutils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Same build and cache key as the workspace job's FFmpeg.
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out
          key: ffmpeg-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg (LGPL, shared)
        if: runner.os != 'Windows'
        run: tools/ffmpeg/build.sh --ci
      - name: FFmpeg (LGPL, shared; MSYS2 shell with the MSVC environment)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tools/ffmpeg/build.sh --ci
      - name: test media matrix
        run: python3 tests/media/media.py generate
      - name: tauri-driver
        # Third-party tools: the workspace's `-D warnings` is not theirs to meet.
        env:
          RUSTFLAGS: ""
        run: cargo install tauri-driver --locked
      - name: msedgedriver matching the runner's WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      # The mock first: a later plain `cargo build` of the desktop crate would replace the app binary with one that
      # loads the Vite dev server instead of the built UI.
      - name: mock Messages API (the assistant's scripted stand-in)
        run: |
          source tools/ffmpeg/env.sh
          cargo build -p ove-agent --example mock_server
      - name: debug app build
        working-directory: apps/desktop
        run: |
          source ../../tools/ffmpeg/env.sh
          pnpm install --frozen-lockfile
          pnpm tauri build --debug --no-bundle
      # The speech model the captions flow downloads on first use (ggml-tiny, 77 MB; checked by sha256 on download).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ove-whisper-models
          key: whisper-models-v1
      - name: app e2e (Linux, Xvfb)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          OVE_WHISPER_MODEL_DIR: ${{ runner.temp }}/ove-whisper-models
        run: |
          source ../../tools/ffmpeg/env.sh
          xvfb-run -a -s "-screen 0 1920x1080x24" pnpm e2e:app
      - name: app e2e (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          OVE_WHISPER_MODEL_DIR: ${{ runner.temp }}/ove-whisper-models
        run: |
          source ../../tools/ffmpeg/env.sh
          pnpm e2e:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-e2e-${{ matrix.os }}
          path: apps/desktop/e2e-app/artefacts
          if-no-files-found: warn

  windows-cross:
    # The Windows code (cfg(windows), the Windows viewer, keyring, FFmpeg and whisper.cpp bindings) checked from a
    # Linux runner with the MinGW-w64 cross build, so it cannot break silently without a Windows runner.
    name: Windows code (cross clippy on Linux)
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: prerequisites (MinGW-w64)
        run: |
          pkgs="gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools nasm meson ninja-build pkg-config cmake clang
            libclang-dev"
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $pkgs
          else
            echo "No passwordless apt on this runner; expecting these packages to be installed: $pkgs"
          fi
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out/windows-x64-gnu
          key: ffmpeg-windows-x64-gnu-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - name: FFmpeg for Windows (LGPL, shared, cross-built)
        run: tools/ffmpeg/build.sh --ci --target windows-x64-gnu
      - name: clippy (x86_64-pc-windows-gnu, whole workspace)
        run: |
          export OVE_FFMPEG_TARGET=windows-x64-gnu
          source tools/ffmpeg/env.sh
          cargo clippy --target x86_64-pc-windows-gnu --workspace --all-targets -- -D warnings

  deny:
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
