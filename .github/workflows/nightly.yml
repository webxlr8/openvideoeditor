name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    strategy:
      fail-fast: false
      matrix:
        target: [read_json, apply_batch, parse_projection, revision_record]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }} for 30 minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=1800
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  long-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '"macos-15"') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '"windows-2025"') || (vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"')) }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: caches from before GGML_NATIVE=OFF hold CPU-specific whisper.cpp objects (.cargo/config.toml).
          prefix-key: v1-rust
      - name: crash harness, retention, performance
        shell: bash
        run: |
          cargo test --release -p ove-store --test crash
          cargo test --release -p ove-store --test store -- --include-ignored
          OVE_PERF_ENFORCE=1 cargo test --release -p ove-store --test perf -- --ignored --nocapture
          cargo test --release -p ove-projection --test perf -- --ignored --nocapture
          OVE_SOAK_SECS=1800 cargo test --release -p ove-store --test projection concurrency_soak -- --nocapture

  # add-model-runtime 3.4: every pinned model and runtime URL still answers (a HEAD request each; fails on a 404).
  # Also keeps the pure-Rust inference backend buildable until the runtime spike has its macOS row.
  model-urls:
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: pinned model and runtime URLs answer
        run: cargo test -p ove-models --test pinned_urls -- --include-ignored --nocapture
      - name: pure-Rust backend still builds
        run: cargo check -p ove-models --features tract

  # add-gpu-compositor-and-scopes 2.3 / D4: CPU/GPU parity and timings on real GPUs (the reference Mac and PC). Runs
  # only where the owner has set OVE_RUNNER_GPU_MACOS / OVE_RUNNER_GPU_WINDOWS to runners with a hardware GPU and the
  # build prerequisites of docs/ci-runners.md; the log names the adapter and every case's metrics and timings.
  gpu-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
    if: ${{ vars.OVE_RUNNER_GPU_MACOS != '' || vars.OVE_RUNNER_GPU_WINDOWS != '' }}
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_GPU_MACOS || '["self-hosted","macOS","ARM64","gpu"]') || (vars.OVE_RUNNER_GPU_WINDOWS || '["self-hosted","Windows","X64","gpu"]')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: FFmpeg (LGPL, shared)
        run: tools/ffmpeg/build.sh --ci
      - name: parity and timings on the hardware GPU
        run: |
          source tools/ffmpeg/env.sh
          mkdir -p gpu-out
          OVE_REQUIRE_GPU=1 cargo test --release -p ove-gpu --test parity --test render_parity -- --nocapture 2>&1 | tee gpu-out/parity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-parity-${{ matrix.os }}
          path: gpu-out
