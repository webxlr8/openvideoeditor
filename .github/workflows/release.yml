name: Release build

# Unsigned installers for testers (signing/notarisation arrive with change 16).
# Run manually for a test build, or push a tag `v<version>` (e.g. v0.1.0-alpha.1) to also publish a draft
# pre-release whose notes come from docs/releases/<version>.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
    runs-on: ${{ fromJSON(matrix.os == 'macos' && (vars.OVE_RUNNER_MACOS || '["self-hosted","macOS","ARM64"]') || matrix.os == 'windows' && (vars.OVE_RUNNER_WINDOWS || '["self-hosted","Windows","X64"]') || (vars.OVE_RUNNER_LINUX || '["self-hosted","Linux","X64"]')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d nasm pkg-config
      - name: prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y nasm
          vcpkg install dav1d:x64-windows
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make pkg-config diffutils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: package
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then msys2 -c 'tools/package.sh'; else tools/package.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  publish:
    # Only for tags: a draft pre-release with both platforms' installers and checksums. A person reviews and publishes it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '["self-hosted","Linux","X64"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          test -f "$notes" || { echo "missing release notes $notes"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
            --title "OpenVideoEditor ${TAG#v}" --notes-file "$notes"
