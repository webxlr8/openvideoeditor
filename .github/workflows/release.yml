name: Release build

# Unsigned installers for testers (signing/notarisation arrive with change 16).
# Run manually for a test build, or push a tag `v<version>` (e.g. v0.1.0-alpha.1) to also publish a draft
# pre-release whose notes come from docs/releases/<version>.md.
#
# Windows: cross-built on a Linux runner with MinGW-w64 (NSIS -setup.exe only; MSI needs WiX on Windows) and smoke
# tested under Wine. macOS: needs a Mac runner (tools/runners/macos-runner.sh); set the repository variable
# OVE_RELEASE_MACOS to `true` once one is registered. Until then the release is drafted without a .dmg.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Dry runs: work branches that change packaging build and smoke-test the installers without publishing.
    branches: ["claude/**"]
    paths: [".github/workflows/release.yml", "tools/package.sh", "tools/notices.sh", "tools/notices/**",
            "tools/ffmpeg/**", "tools/cross/**", "about.toml", "apps/desktop/src-tauri/tauri.conf.json"]

permissions:
  contents: read

jobs:
  package-macos:
    if: vars.OVE_RELEASE_MACOS == 'true'
    # A failed or missing macOS build does not hold back the Windows installer; publish lists it as missing.
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_MACOS || '["self-hosted","macOS","ARM64"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs rustup on the runner if it is missing; the version matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prerequisites
        run: brew install dav1d nasm pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: package
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          if-no-files-found: error
          path: target/release/bundle/dmg/*.dmg

  package-windows:
    name: package-windows (cross-built on Linux)
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '["self-hosted","Linux","X64"]') }}
    env:
      # Shared runners: two compiles at a time keeps the release build (LTO) within memory.
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prerequisites (MinGW-w64, NSIS, Wine)
        run: |
          pkgs="gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools nasm meson ninja-build pkg-config cmake clang
            libclang-dev nsis wine wine64 p7zip-full ffmpeg"
          if command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $pkgs
          else
            echo "No passwordless apt on this runner; expecting these packages to be installed: $pkgs"
          fi
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/out/windows-x64-gnu
          key: ffmpeg-windows-x64-gnu-${{ hashFiles('tools/ffmpeg/*.sh') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: package (FFmpeg, ove sidecar, app, NSIS installer)
        run: tools/package.sh --target windows-x64-gnu
      - name: test media (generated with the runner's ffmpeg CLI; test-only)
        run: python3 tests/media/media.py generate
      - name: smoke test of the installed ove.exe under Wine
        run: |
          # The installer's payload as it lands in the install folder (7-Zip reads NSIS archives).
          rm -rf "$RUNNER_TEMP/ove-windows"
          7z x -y -o"$RUNNER_TEMP/ove-windows" target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe > /dev/null
          ls -l "$RUNNER_TEMP/ove-windows"
          tools/cross/wine-smoke.sh "$RUNNER_TEMP/ove-windows"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          if-no-files-found: error
          path: target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe

  publish:
    # Only for tags: a draft pre-release with the installers that were built and checksums. A person reviews and
    # publishes it. Needs the Windows installer; macOS is added when its job succeeded.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package-windows.result == 'success'
    needs: [package-windows, package-macos]
    runs-on: ${{ fromJSON(vars.OVE_RUNNER_LINUX || '["self-hosted","Linux","X64"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          test -f "$notes" || { echo "missing release notes $notes"; exit 1; }
          cp "$notes" "$RUNNER_TEMP/notes.md"
          missing=()
          ls dist/*-setup.exe > /dev/null 2>&1 || missing+=("Windows")
          ls dist/*.dmg > /dev/null 2>&1 || missing+=("macOS")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '\n## Not in this build\n\nNo installer for: %s. It follows in a later build.\n' "${missing[*]}" \
              >> "$RUNNER_TEMP/notes.md"
          fi
          # LGPL: the exact FFmpeg source and the scripts that build it travel with every release.
          curl -fsSL -o dist/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          echo "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  dist/ffmpeg-9.0.2.tar.xz" | sha256sum -c -
          tar -czf dist/ffmpeg-build-scripts.tar.gz tools/ffmpeg/build.sh tools/ffmpeg/env.sh tools/ffmpeg/check-license.sh \
            tools/ffmpeg/README.md tools/cross
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
            --title "OpenVideoEditor ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
