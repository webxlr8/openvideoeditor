# Licence and advisory policy (docs/03-architecture-plan.md §5, openspec/config.yaml hard rules).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # FFmpeg bindings: the wrapper crates are WTFPL; FFmpeg itself is built LGPL-only and linked dynamically.
    "WTFPL",
    # whisper-rs / whisper-rs-sys (speech recognition bindings) are public domain; whisper.cpp itself is MIT.
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
