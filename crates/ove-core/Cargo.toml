[package]
name = "ove-core"
description = "Project document model, ops, invariants, revisions (pure, no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
imbl = "7.0"
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
proptest = { version = "1.12", optional = true }

[features]
# Random document and batch generators for property tests in this and downstream crates.
testgen = ["dep:proptest"]

[dev-dependencies]
proptest = "1.12"
ove-core = { path = ".", features = ["testgen"] }

[lints]
workspace = true
