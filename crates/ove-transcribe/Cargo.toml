[package]
name = "ove-transcribe"
description = "Offline word-level speech-to-text (whisper.cpp) and caption segmentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ove-guard = { path = "../ove-guard" }
ove-media = { path = "../ove-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
