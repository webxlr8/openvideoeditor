[package]
name = "ove-transcribe"
description = "Offline word-level speech-to-text (whisper.cpp) and caption segmentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ove-core = { path = "../ove-core" }
ove-edit = { path = "../ove-edit" }
ove-media = { path = "../ove-media", optional = true }
ove-models = { path = "../ove-models" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
whisper-rs = { version = "0.16", optional = true }

[features]
default = ["recognize"]
# Speech recognition (whisper.cpp) and audio decoding (FFmpeg). Off: transcript types, cache, timeline transcript,
# fillers and voice activity through the shared runtime only.
recognize = ["audio", "dep:whisper-rs"]
# Audio decoding (FFmpeg) for levels and voice activity, without the recognition library.
audio = ["dep:ove-media"]

[dev-dependencies]
ove-store = { path = "../ove-store" }
proptest = "1.12"
ove-models = { path = "../ove-models", features = ["onnx"] }
tempfile = "3"

[lints]
workspace = true
