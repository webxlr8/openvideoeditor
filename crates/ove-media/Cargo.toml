[package]
name = "ove-media"
description = "Media probe and decode (FFmpeg, hardware first)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ffmpeg-the-third = { version = "6", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
md-5 = "0.10"
tempfile = "3"
