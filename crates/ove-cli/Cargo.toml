[package]
name = "ove-cli"
description = "The ove command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ove"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ove-analyze = { path = "../ove-analyze", optional = true }
ove-control = { path = "../ove-control" }
ove-core = { path = "../ove-core" }
ove-generate = { path = "../ove-generate" }
ove-interchange = { path = "../ove-interchange" }
ove-projection = { path = "../ove-projection" }
ove-media = { path = "../ove-media", optional = true }
ove-render = { path = "../ove-render", optional = true }
ove-store = { path = "../ove-store" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
# Reading media, analysis and `ove export` (links FFmpeg). Desktop bundles build the CLI with it.
media = ["dep:ove-analyze", "dep:ove-media", "dep:ove-render"]
# Former name of `media`.
export = ["media"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
