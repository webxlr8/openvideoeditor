[package]
name = "ove-cli"
description = "The ove command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ove"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ove-core = { path = "../ove-core" }
ove-projection = { path = "../ove-projection" }
ove-store = { path = "../ove-store" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
