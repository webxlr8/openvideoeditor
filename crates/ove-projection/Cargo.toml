[package]
name = "ove-projection"
description = "Timeline TSX projection: printer, parser, diff, merge, verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce = "1.0"
ove-core = { path = "../ove-core" }
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ove-core = { path = "../ove-core", features = ["testgen"] }
proptest = "1.12"
tempfile = "3"

[lints]
workspace = true
