[package]
name = "ove-store"
description = "Project bundles, library, durable persistence and locking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ove-core = { path = "../ove-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
trash = "5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
ove-core = { path = "../ove-core", features = ["testgen"] }
proptest = "1.12"
tempfile = "3"

[lints]
workspace = true
