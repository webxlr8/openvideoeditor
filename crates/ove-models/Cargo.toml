[package]
name = "ove-models"
description = "Local machine-learning models: pinned manifests, verified resumable downloads, the model store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The ONNX backend (ONNX Runtime, loaded at run time from a library file; nothing native is linked).
onnx = ["dep:ort"]
# The pure-Rust backend, kept buildable until the runtime spike has its macOS row (add-model-runtime task 1.2).
tract = ["dep:tract-onnx"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
ove-guard = { path = "../ove-guard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tract-onnx = { version = "=0.23.10", optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Extracts the runtime library from its wheel; deflate only.
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
