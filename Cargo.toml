[workspace]
resolver = "3"
members = [
    "crates/ove-core",
    "crates/ove-store",
    "crates/ove-projection",
    "crates/ove-cli",
    "crates/ove-control",
    "crates/ove-generate",
    "crates/ove-interchange",
    "crates/ove-agent",
    "crates/ove-media",
    "crates/ove-playback",
    "crates/ove-gpu",
    "crates/ove-bench",
    "crates/ove-transcribe",
    "crates/ove-render",
    "crates/ove-analyze",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/ove-core",
    "crates/ove-control",
    "crates/ove-generate",
    "crates/ove-interchange",
    "crates/ove-store",
    "crates/ove-projection",
    "crates/ove-cli",
    "crates/ove-agent",
    "crates/ove-playback",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# Smaller target dirs: line tables for our crates, no debug info for dependencies.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 1

[profile.dev.package.proptest]
opt-level = 3

# Speech recognition is unusably slow unoptimised; build whisper.cpp optimised in dev and test builds too.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.test.package.whisper-rs-sys]
opt-level = 3
